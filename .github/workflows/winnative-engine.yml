name: engine

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"
  push:
    branches: [winnative]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}
  SYNC_BRANCH: winnative
  # love-android 11.5a pins this NDK; scripts/build_android.sh asserts it.
  NDK_VERSION: 25.2.9519653
  ABI: arm64-v8a

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winnative
          fetch-depth: 0
          submodules: recursive

      - name: Sync upstream
        id: sync
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          parent=$(gh repo view "$GITHUB_REPOSITORY" --json parent --jq 'if .parent then .parent.owner.login + "/" + .parent.name else "" end')
          if [ -z "$parent" ]; then
            echo "No upstream parent; building the branch as-is."
            exit 0
          fi
          branch=$(gh repo view "$parent" --json defaultBranchRef --jq .defaultBranchRef.name)
          echo "upstream $parent@$branch"
          git config user.name "winnative-ci"
          git config user.email "ci@winnative.dev"
          git remote add upstream "https://github.com/$parent.git" 2>/dev/null || \
            git remote set-url upstream "https://github.com/$parent.git"
          git fetch --no-tags upstream "$branch"
          before=$(git rev-parse HEAD)
          if ! git merge --no-edit "upstream/$branch"; then
            git merge --abort || git reset --hard "$before"
            echo "::warning::Upstream merge conflicts; $SYNC_BRANCH left untouched. Resolve by hand, then re-run."
            exit 0
          fi
          after=$(git rev-parse HEAD)
          if [ "$before" = "$after" ]; then
            echo "Already up to date with upstream."
            exit 0
          fi
          git submodule update --init --recursive || echo "::warning::submodule update incomplete"
          if ! git push origin "HEAD:$SYNC_BRANCH"; then
            git fetch --no-tags origin "$SYNC_BRANCH"
            if git merge --no-edit "origin/$SYNC_BRANCH" && git push origin "HEAD:$SYNC_BRANCH"; then
              echo "Re-merged a concurrent update to $SYNC_BRANCH."
            else
              git merge --abort || true
              echo "::warning::$SYNC_BRANCH moved during the run; skipping. The next run picks it up."
              exit 0
            fi
          fi
          echo "Merged $(git rev-list --count $before..$after) upstream commit(s)."

      - name: Has the source changed since the last release?
        id: src
        run: |
          # The last commit touching anything outside .github, so editing the
          # workflow never triggers a rebuild. The Android toolchain does not
          # compile reproducibly, so comparing built bytes cannot decide this.
          src=$(git log -1 --format=%H -- . ':(exclude).github')
          prev=$(curl -sfL "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/source.sha" | tr -d '[:space:]' || true)
          echo "source    $src"
          echo "published ${prev:-<none>}"
          echo "$src" > source.sha
          if [ "$src" = "$prev" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "This source has already been built and released; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.src.outputs.changed == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK
        if: steps.src.outputs.changed == 'true'
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build
        if: steps.src.outputs.changed == 'true'
        run: |
          # Builds the vendored love-android tree and packages game.love. The
          # APK itself is not shipped: WinNative hosts the engine in its own
          # process, so only the arm64-v8a runtime and the game archive are
          # published. Building the APK is still the supported way to produce
          # both, and it keeps this workflow on the upstream build path.
          scripts/build_android.sh

      - name: Collect
        if: steps.src.outputs.changed == 'true'
        run: |
          apk="$(find mobile/android/app/build/outputs/apk dist/android -name '*.apk' | head -1)"
          if [ -z "$apk" ]; then
            echo "no APK produced" >&2
            exit 1
          fi
          echo "extracting from $apk"
          work=$(mktemp -d)
          unzip -q "$apk" -d "$work"

          mkdir -p stage/lib
          if ! cp "$work/lib/$ABI/"*.so stage/lib/ 2>/dev/null; then
            echo "APK carries no $ABI libraries" >&2
            exit 1
          fi

          # game.love is the whole Lua engine plus its assets. It is an asset in
          # the APK, but a fresh build also leaves it in the embed source tree.
          love="$work/assets/game.love"
          [ -f "$love" ] || love="mobile/android/app/src/embed/assets/game.love"
          [ -f "$love" ] || { echo "game.love not found" >&2; exit 1; }
          cp "$love" stage/game.love

          ls -l stage stage/lib

          # Packed with the same reproducible flags Retro-Consoles uses, so an
          # unchanged engine keeps producing an identical archive and the
          # bundler can skip the repack.
          mkdir -p dist
          ( cd stage && find . -type f | LC_ALL=C sort | \
            zip -q -X -o "$OLDPWD/dist/gen1recomp-engine.zip" -@ )
          ls -l dist

      - uses: actions/upload-artifact@v4
        if: steps.src.outputs.changed == 'true'
        with:
          name: gen1recomp-engine.zip
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish release
        if: steps.src.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed=0
          for f in dist/*.zip; do
            name=$(basename "$f")
            prev=$(mktemp -d)/"$name"
            if gh release download latest --pattern "$name" --output "$prev" 2>/dev/null && cmp -s "$prev" "$f"; then
              echo "$name unchanged"
            else
              echo "$name changed"
              changed=1
            fi
          done
          if [ "$changed" = "0" ]; then
            echo "Every artifact is byte-identical to the published release; nothing to publish."
            exit 0
          fi
          tag="build-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes "$ABI engine build from ${GITHUB_SHA}"
          fi
          gh release upload "$tag" dist/*.zip source.sha --clobber
          if ! gh release view latest > /dev/null 2>&1; then
            gh release create latest --title latest --notes "Rolling build."
          fi
          gh release upload latest dist/*.zip source.sha --clobber
          gh release edit latest --notes "Rolling; newest immutable tag: $tag"
          echo "$tag"
